name: Build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  # Weekly refresh of the apt packages, roughly matching GitHub's hosted image cadence
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # Always GitHub-hosted: this repo is public (never run its jobs on the self-hosted
    # runners), and the image shouldn't depend on the runners built from it.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read runner version
        id: version
        run: |
          version="$(sed -nE 's|^FROM ghcr.io/actions/actions-runner:([0-9.]+).*|\1|p' Dockerfile)"
          test -n "$version"
          echo "runner=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smoke:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm smoke:${{ github.sha }} bash -euxc '
            test "$(id -un)" = runner
            sudo -n true
            /home/runner/config.sh --version
            gh --version
            docker --version
            docker buildx version
            docker compose version
            git --version
            jq --version
            zstd --version
            make --version
            gcc --version
            for t in curl wget unzip zip xz rsync ssh python3; do command -v "$t"; done
          '

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.runner }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=ARC runner image with GitHub-hosted ubuntu-latest essentials
            org.opencontainers.image.version=${{ steps.version.outputs.runner }}
          cache-from: type=gha
